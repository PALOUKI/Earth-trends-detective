- id: gistemp_tas_anom
  name: Surface temperature anomaly
  name_fr: Anomalie de température de surface
  source: NASA GISS GISTEMP v4, Land-Ocean Temperature Index, ERSSTv5, 1200 km smoothing
  doi: 10.1029/2023JD040179
  unit: K
  frequency: monthly
  grid: 2x2 degree
  period: 1880-present (source updates monthly)
  higher_is: warming
  description: Monthly surface temperature difference from the 1951–1980 mean on a regular 2° grid.
  description_fr: Écart mensuel de température de surface par rapport à la moyenne 1951–1980 sur une grille régulière de 2°.
  limitations: Blended land and ocean analysis; temporal and spatial coverage vary; anomalies are not absolute temperatures.
  access:
    type: url
    ref: https://data.giss.nasa.gov/pub/gistemp/gistemp1200_GHCNv4_ERSSTv5.nc.gz
- id: modis_ndvi
  name: MODIS monthly vegetation index (NDVI)
  name_fr: Indice mensuel de végétation MODIS (NDVI)
  source: NASA Terra MODIS Vegetation Indices Monthly L3 Global 0.05Deg CMG, Version 061 (MOD13C2)
  short_name: MOD13C2
  version: "061"
  doi: 10.5067/MODIS/MOD13C2.061
  unit: "1"
  frequency: monthly
  grid: 0.05 degree source; planned 2 degree analysis grid
  period: 2000-02 onward (granules available in CMR; complete time-series ingest pending)
  higher_is: greener vegetation signal (subject to product limitations)
  description: Monthly MODIS normalized difference vegetation index. Source integers are scaled by 1/10000; only reliability ranks 0 and 1 are retained in the ingest adapter.
  description_fr: Indice mensuel de végétation normalisé MODIS. Les valeurs entières sont mises à l'échelle par 1/10000 ; l'adaptateur conserve les rangs de fiabilité 0 et 1.
  limitations: Satellite vegetation-index proxy; clouds, snow, aerosols, viewing conditions, and land cover affect retrievals. The time series and full trend products have not yet been ingested.
  integration_status: source_verified_sample_downloaded
  access:
    type: earthaccess
    short_name: MOD13C2
    version: "061"
