[project]
name = "earth-trends-detective"
version = "0.1.0"
description = "A reproducible NASA Earth science trend investigation MVP."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "pydantic==2.11.4",
  "numpy==2.2.5",
  "numba==0.68.0",
  "pandas==2.2.3",
  "scipy==1.15.3",
  "xarray==2025.4.0",
  "dask[array]==2025.4.1",
  "zarr==2.18.7",
  "netCDF4==1.7.2",
  "h5netcdf==1.6.1",
  "earthaccess==0.14.0",
  "pymannkendall==1.4.3",
  "rio-tiler==9.4.9",
  "statsmodels==0.14.4",
  "python-dotenv==1.1.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "ruff==0.11.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["api/tests", "pipeline"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
